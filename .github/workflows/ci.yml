# Build the site with Zensical and publish it to GitHub Pages.
#
# This repository is the user/org Pages site AVDASI2/avdasi2.github.io, so the
# build is served at https://avdasi2.github.io/ with no path prefix.
#
# One-off setting: Settings > Pages > Build and deployment > Source must be
# "GitHub Actions". The previous site (MkDocs, published from AVDASI2/docs) is
# tagged v2025-26-mkdocs and v2025-26-site in that repository.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # avionics/examplecode.md includes these scripts from docs/code/.
      - run: ./scripts/fetch-example-code.sh

      - run: zensical build --clean

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
