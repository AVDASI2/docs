# Build the site with Zensical and publish it to the gh-pages branch, which
# GitHub Pages serves at https://avdasi2.github.io/docs/. This is the same
# branch `mkdocs gh-deploy` used, so the Pages settings don't change.
# The site as last built by MkDocs is tagged v2025-26-site.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # avionics/examplecode.md includes these scripts from docs/code/.
      - run: ./scripts/fetch-example-code.sh

      - run: zensical build --clean

      - if: github.ref == 'refs/heads/main'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          ghp-import --no-jekyll --push --force --message "Deploy ${GITHUB_SHA::7}" site
