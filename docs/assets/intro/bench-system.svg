<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img"
     aria-label="The bench system: mains supply feeds the power module and a BEC; the Cube drives servos and reads sensors; the transmitter reaches the Cube through a receiver, and the laptop through a Wi-Fi telemetry link.">
  <title>The system on the bench</title>
  <style>
    .b  { fill:#ffffff; stroke:#1e1e24; stroke-width:2; }
    .cube { fill:#fdf1f2; stroke:#b01c2e; stroke-width:3; }
    .t  { font:600 15px "Trebuchet MS",sans-serif; fill:#1e1e24; }
    .s  { font:12.5px "Trebuchet MS",sans-serif; fill:#4a4a52; }
    .k  { font:700 13px "Trebuchet MS",sans-serif; }
    .pw { fill:none; stroke:#ee7219; stroke-width:3; marker-end:url(#o); }
    .sg { fill:none; stroke:#1e1e24; stroke-width:2; marker-end:url(#d); }
    .rf { fill:none; stroke:#00c0b5; stroke-width:2.5; stroke-dasharray:6 4; marker-end:url(#t); }
  </style>
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ee7219"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1e1e24"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00c0b5"/></marker>
  </defs>

  <!-- key -->
  <line x1="640" y1="24" x2="672" y2="24" stroke="#ee7219" stroke-width="3"/>
  <text x="678" y="28" class="k" fill="#ee7219">power</text>
  <line x1="740" y1="24" x2="772" y2="24" stroke="#1e1e24" stroke-width="2"/>
  <text x="778" y="28" class="k" fill="#1e1e24">signal</text>
  <line x1="836" y1="24" x2="866" y2="24" stroke="#00c0b5" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="820" y="44" class="k" fill="#00c0b5">wireless</text>

  <!-- power chain -->
  <rect class="b" x="20" y="60" width="150" height="52" rx="6"/>
  <text x="95" y="84" class="t" text-anchor="middle">Bench supply</text>
  <text x="95" y="102" class="s" text-anchor="middle">mains, ≤ 15 V</text>

  <path class="pw" d="M170 78 L235 78"/>
  <rect class="b" x="235" y="52" width="140" height="52" rx="6"/>
  <text x="305" y="76" class="t" text-anchor="middle">Power module</text>
  <text x="305" y="94" class="s" text-anchor="middle">regulates + measures</text>

  <path class="pw" d="M170 96 L200 96 L200 180 L235 180"/>
  <rect class="b" x="235" y="154" width="140" height="52" rx="6"/>
  <text x="305" y="178" class="t" text-anchor="middle">BEC</text>
  <text x="305" y="196" class="s" text-anchor="middle">5 V for the servos</text>

  <!-- cube -->
  <rect class="cube" x="430" y="96" width="170" height="86" rx="8"/>
  <text x="515" y="130" class="t" text-anchor="middle" fill="#b01c2e">Cube Orange+</text>
  <text x="515" y="150" class="s" text-anchor="middle">flight controller</text>
  <text x="515" y="168" class="s" text-anchor="middle">logs to SD card</text>

  <path class="pw" d="M375 78 L515 78 L515 96"/>
  <path class="pw" d="M375 180 L410 180 L410 228 L640 228"/>

  <!-- servos -->
  <rect class="b" x="640" y="202" width="160" height="52" rx="6"/>
  <text x="720" y="226" class="t" text-anchor="middle">Servos</text>
  <text x="720" y="244" class="s" text-anchor="middle">control surfaces</text>
  <path class="sg" d="M600 150 L620 150 L620 216 L638 216"/>
  <text x="612" y="140" class="s">PWM</text>

  <!-- sensors -->
  <rect class="b" x="640" y="96" width="160" height="52" rx="6"/>
  <text x="720" y="120" class="t" text-anchor="middle">Sensors</text>
  <text x="720" y="138" class="s" text-anchor="middle">ADC · I²C</text>
  <path class="sg" d="M638 122 L602 122"/>

  <!-- RC link -->
  <rect class="b" x="20" y="286" width="150" height="52" rx="6"/>
  <text x="95" y="310" class="t" text-anchor="middle">Transmitter</text>
  <text x="95" y="328" class="s" text-anchor="middle">the safety pilot</text>
  <path class="rf" d="M170 312 L232 312"/>
  <rect class="b" x="235" y="286" width="140" height="52" rx="6"/>
  <text x="305" y="310" class="t" text-anchor="middle">Receiver</text>
  <text x="305" y="328" class="s" text-anchor="middle">on the aircraft</text>
  <path class="sg" d="M375 312 L515 312 L515 184"/>

  <!-- telemetry -->
  <rect class="b" x="640" y="286" width="160" height="52" rx="6"/>
  <text x="720" y="310" class="t" text-anchor="middle">Laptop</text>
  <text x="720" y="328" class="s" text-anchor="middle">Mission Planner</text>
  <path class="rf" d="M600 140 L616 140 L616 300 L638 300"/>
  <path class="rf" d="M638 292 L618 292 L618 132 L602 132"/>
  <text x="626" y="272" class="s" transform="rotate(-90 626 272)">Wi-Fi telemetry</text>

  <text x="450" y="404" class="t" text-anchor="middle">Two ways in: the radio, and the telemetry link. The spec wants both.</text>
  <text x="450" y="430" class="s" text-anchor="middle">Nothing that moves is powered from laptop USB.</text>
</svg>
